<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Atharv Pandey: first-year Software Engineering student at the University of Waterloo">
  <style>
    .spin { transform-origin: 820px 128px; animation: spin 90s linear infinite; }
    .route { animation: route 3s linear infinite; }
    .beam { animation: beam 7s ease-in-out infinite; transform-origin: 700px 232px; }
    .lit1 { animation: tw 3.1s ease-in-out infinite; }
    .lit2 { animation: tw 4.3s ease-in-out infinite 1.2s; }
    .lit3 { animation: tw 5.2s ease-in-out infinite 2.4s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes route { to { stroke-dashoffset: -28; } }
    @keyframes beam { 0%,100% { transform: rotate(-4deg); opacity:.55; } 50% { transform: rotate(5deg); opacity:.8; } }
    @keyframes tw { 0%,100% { opacity:.25; } 50% { opacity:.95; } }
    /* Respect the system "reduce motion" setting. */
    @media (prefers-reduced-motion: reduce) {
      .spin, .route, .beam, .lit1, .lit2, .lit3 { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f13"/><stop offset="0.6" stop-color="#151922"/><stop offset="1" stop-color="#1b1620"/>
    </linearGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.3" fill="#fff"/></pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="dotmask"><rect width="1000" height="300" fill="url(#fade)"/></mask>
    <linearGradient id="beamg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4d9bd" stop-opacity="0.55"/><stop offset="1" stop-color="#f4d9bd" stop-opacity="0"/></linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8833a"/><stop offset="1" stop-color="#e8833a" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <!-- Comic halftone, strongest on the right -->
  <rect width="1000" height="300" fill="url(#dots)" opacity="0.09" mask="url(#dotmask)"/>

  <!-- Compass rose, slowly turning -->
  <g class="spin" fill="none" stroke="#e8833a" opacity="0.3" stroke-width="1.4">
    <circle cx="820" cy="128" r="104"/><circle cx="820" cy="128" r="96" stroke-width="0.6"/>
    <path d="M820.0 36.0 L809.6 117.6 L820 128 L830.4 117.6 Z"/>
      <path d="M912.0 128.0 L830.4 117.6 L820 128 L830.4 138.4 Z"/>
      <path d="M820.0 220.0 L830.4 138.4 L820 128 L809.6 138.4 Z"/>
      <path d="M728.0 128.0 L809.6 138.4 L820 128 L809.6 117.6 Z"/>
      <path d="M820 128 L860.3 87.7" stroke-width="1"/>
      <path d="M820 128 L860.3 168.3" stroke-width="1"/>
      <path d="M820 128 L779.7 168.3" stroke-width="1"/>
      <path d="M820 128 L779.7 87.7" stroke-width="1"/>
  </g>

  <!-- Searchlight beam from a rooftop -->
  <path class="beam" d="M700 232 L650 -20 L750 -20 Z" fill="url(#beamg)"/>

  <!-- Dotted route ending in an X -->
  <path class="route" d="M 40 270 C 230 220, 330 255, 470 232 S 700 190, 790 214" fill="none" stroke="#e8833a" stroke-width="2" stroke-dasharray="7 7" opacity="0.8"/>
  <g stroke="#e8833a" stroke-width="3" stroke-linecap="round"><path d="M783 207 L797 221"/><path d="M797 207 L783 221"/></g>

