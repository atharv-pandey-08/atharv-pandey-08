    <text x="40" y="120" textLength="520" lengthAdjust="spacing" font-size="62" font-weight="700" fill="#f2f2f4" letter-spacing="1">ATHARV PANDEY</text>
    <text x="42" y="154" textLength="470" lengthAdjust="spacing" font-size="20" fill="#c9ccd6">Software Engineering at the University of Waterloo</text>
    <text x="42" y="180" textLength="360" lengthAdjust="spacing" font-size="14" fill="#8b90a0" letter-spacing="0.5">Building things I can measure and explain.</text>
  </g>
  <rect x="42" y="194" width="64" height="3" fill="#e8833a"/>

